[project]
name = "image-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "img2pdf>=0.5",
    "ipykernel>=7.3.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.scripts]
image-converter = "image_converter:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
